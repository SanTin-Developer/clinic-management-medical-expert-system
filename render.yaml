# Render Blueprint for the RoyalCare Clinic backend.
#
# Topology (backend only, free-tier friendly):
#   royalcare-clinic-api      Docker web service  -> Laravel API + Reverb (port 8000)
#   royalcare-clinic-expert   Docker web service  -> FastAPI expert system (port 8001)
#
# The admin dashboard and public website are NOT part of this Blueprint. Deploy
# them separately (Render static sites, Netlify, Vercel, or locally) and point
# their VITE_API_URL at the API below.
#
# PostgreSQL is deliberately NOT provisioned here. The deployment uses Supabase
# as the system of record. Render prompts for DB_URL when the Blueprint is
# created; use the Supabase *session pooler* URI (port 5432, IPv4, prepared
# statements supported) and keep ?sslmode=require. See
# docs/10-deployment/index.md, section 10.13.
#
# Redis is intentionally not provisioned either: Render allows only one free
# Key Value instance per workspace. Cache and sessions use the ephemeral local
# disk, and queues use the database (the jobs table is part of the migrations).
# To use Redis instead, create a Key Value instance and add REDIS_URL,
# REDIS_CLIENT, and switch CACHE_STORE / SESSION_DRIVER / QUEUE_CONNECTION to
# `redis` on the API service.
#
# The onrender.com hostnames below are derived from the service names. If you
# rename a service (or attach custom domains), update APP_URL,
# EXPERT_SYSTEM_URL, and the CORS values to match.

services:
  # ---------------------------------------------------------------------------
  # Laravel API (nginx + php-fpm + queue + scheduler + Reverb + Telegram poller)
  # ---------------------------------------------------------------------------
  - type: web
    name: royalcare-clinic-api
    runtime: docker
    plan: free
    region: singapore
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrates, seeds the reference data, then hands over to Supervisor.
    dockerCommand: /usr/local/bin/render-entrypoint.sh
    healthCheckPath: /up
    # Runs once after the first successful deploy. The entrypoint already
    # applies migrations and seeds ProductionSeeder on every boot; this adds the
    # one-time demo/content data set.
    initialDeployHook: "php artisan migrate --force --no-interaction && php artisan db:seed --force --no-interaction"
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # --- Render runtime ---------------------------------------------------
      - key: PORT
        value: "8000"

      # --- Application ------------------------------------------------------
      - key: APP_NAME
        value: RoyalCare Clinic
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://royalcare-clinic-api.onrender.com
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: BCRYPT_ROUNDS
        value: "12"

      # --- Database: Supabase ----------------------------------------------
      # DB_URL is prompted for in the Render dashboard. Format:
      #   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      # Do NOT use the transaction pooler on port 6543 (no prepared statements).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      # --- Cache / queues / sessions ---------------------------------------
      # No Key Value instance: Render allows only one free one per workspace.
      # `file` lives on the ephemeral disk (reset on deploy/restart); queues use
      # the database, which is durable in Supabase.
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "480"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: SANCTUM_EXPIRATION
        value: "480"
      # Only needed for cookie-based SPA auth; the shipped SPA uses bearer
      # tokens. Add the real frontend host here if you enable cookies.
      - key: SANCTUM_STATEFUL_DOMAINS
        value: localhost:5173,localhost:5174

      # --- URLs / CORS ------------------------------------------------------
      # Backend-only deployment: the frontend runs separately (locally at
      # 5173/5174 by default). Add your deployed frontend origin before going
      # live, e.g. https://your-admin.example.com.
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:5174

      # --- Realtime: Laravel Reverb inside this container ------------------
      # Browsers connect to wss://<api-host>/app/<key>; nginx proxies /app to
      # Reverb on 127.0.0.1:8080. Server-side broadcasting also uses 127.0.0.1.
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        value: royalcare-clinic
      # Public value: it is embedded in the SPA bundle and the WebSocket path.
      # Keep it URL-safe and identical to the frontend's VITE_REVERB_APP_KEY.
      - key: REVERB_APP_KEY
        value: royalcare-clinic-key
      - key: REVERB_APP_SECRET
        generateValue: true
      - key: REVERB_HOST
        value: 127.0.0.1
      - key: REVERB_PORT
        value: "8080"
      - key: REVERB_SCHEME
        value: http
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0
      - key: REVERB_SERVER_PORT
        value: "8080"
      - key: REVERB_SCALING_ENABLED
        value: "false"

      # --- Medical expert system (FastAPI) ---------------------------------
      # Free web services sleep when idle, so allow for a cold start.
      - key: EXPERT_SYSTEM_URL
        value: https://royalcare-clinic-expert.onrender.com
      - key: EXPERT_SYSTEM_API_KEY
        generateValue: true
      - key: EXPERT_SYSTEM_TIMEOUT
        value: "60"
      - key: EXPERT_SYSTEM_CONNECT_TIMEOUT
        value: "15"

      # --- Mail / optional integrations (demo defaults) --------------------
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@clinic.local
      - key: AUTH_SECURITY_ALERTS_ENABLED
        value: "false"
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_WEBHOOK_ENABLED
        value: "false"
      # Explicitly disable the poller: otherwise the worker exits non-zero when
      # Telegram is unconfigured and Supervisor restarts it in a loop.
      - key: TELEGRAM_POLLING_ENABLED
        value: "false"

      # --- Storage / uploads ------------------------------------------------
      # Render's filesystem is ephemeral: anything written to the local disk is
      # lost on the next deploy/restart. Patient documents therefore go to
      # Cloudinary (DOCUMENTS_DISK=cloudinary); announcement posters and
      # website media switch to Cloudinary automatically once the credentials
      # below are present. Keep FILESYSTEM_DISK=local for throwaway scratch
      # files that never need to survive a restart.
      - key: FILESYSTEM_DISK
        value: local
      - key: DOCUMENTS_DISK
        value: cloudinary
      - key: FILE_SCANNER_DRIVER
        value: "null"
      # Cloudinary credentials are secrets: enter them in the Render dashboard
      # (or set them with the Render API/CLI), not in this file.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: Clinic Management System and Medical Expert systems
      - key: CLOUDINARY_SECURE
        value: "true"

      # --- Logging ----------------------------------------------------------
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # --- Auth defaults ----------------------------------------------------
      - key: AUTH_OTP_ENABLED
        value: "false"
      - key: AUTH_2FA_MANDATORY
        value: "false"
      - key: AUTH_LOCKOUT_ENABLED
        value: "false"
      - key: AUTH_REQUIRE_VERIFIED_EMAIL
        value: "false"
      - key: AUTH_ENFORCE_TRUSTED_DEVICE
        value: "false"

      # --- Demo data --------------------------------------------------------
      # Seeds the demo logins (admin + one per role) on the first deploy.
      # Set to false and delete/disable the demo accounts before storing real
      # patient data. See docs/10-deployment/index.md.
      - key: SEED_DEMO_USERS
        value: "true"

  # ---------------------------------------------------------------------------
  # FastAPI medical expert system
  # ---------------------------------------------------------------------------
  - type: web
    name: royalcare-clinic-expert
    runtime: docker
    plan: free
    region: singapore
    branch: master
    dockerfilePath: ./expert-system/Dockerfile
    dockerContext: ./expert-system
    healthCheckPath: /health
    buildFilter:
      paths:
        - expert-system/**
        - render.yaml
    envVars:
      - key: PORT
        value: "8001"
      # Share the Supabase URL with the API. The expert service rewrites the
      # scheme to postgresql+psycopg and appends DB_SSLMODE when needed.
      - key: DATABASE_URL
        fromService:
          type: web
          name: royalcare-clinic-api
          envVarKey: DB_URL
      - key: DB_SSLMODE
        value: require
      # Must match EXPERT_SYSTEM_API_KEY on the API service.
      - key: EXPERT_SYSTEM_API_KEY
        fromService:
          type: web
          name: royalcare-clinic-api
          envVarKey: EXPERT_SYSTEM_API_KEY
      - key: LOG_LEVEL
        value: INFO
      # Small pool: Supabase's free session pooler has a limited connection
      # budget shared with the Laravel API.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: EXPERT_RULES_CACHE_TTL_SECONDS
        value: "60"
      - key: EXPERT_SYSTEM_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: EXPERT_AUDIT_ENABLED
        value: "false"
