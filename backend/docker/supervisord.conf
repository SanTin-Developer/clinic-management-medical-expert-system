[supervisord]
nodaemon=true
user=root

; The project directory is a bind mount owned by root while php-fpm runs as
; www-data; running `php artisan` via `docker exec` (root) can leave
; root-owned files under storage/, which makes Laravel fail to write logs and
; double-fault (losing CORS headers on error responses). Normalise permissions
; once on start, before php-fpm and nginx come up.
[program:fix-permissions]
command=/bin/sh -c "chmod -R a+rwX /var/www/html/storage /var/www/html/bootstrap/cache 2>/dev/null || true"
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One-shot: hit the app once so php-fpm's OPcache is warm before the first
; real request arrives. Exits after a single run.
[program:warmup]
command=sh /usr/local/bin/warmup.sh
autostart=true
autorestart=false
startsecs=0
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Long-running queue worker for notifications, Telegram delivery and any other
; queued jobs. Runs as www-data so it never creates root-owned files under
; storage/. --max-time restarts it hourly to release any leaked memory.
[program:queue-worker]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel Reverb websocket server (browser clients connect on the published
; REVERB_PORT). Binds 0.0.0.0 so the host can reach it.
[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Telegram long-polling worker. Used when no public HTTPS webhook is available
; (e.g. local development). The command exits with code 0 when webhook mode is
; enabled, so `autorestart=unexpected` keeps the two delivery modes mutually
; exclusive and prevents a restart loop.
[program:telegram-poll]
command=php artisan telegram:poll
directory=/var/www/html
user=www-data
autostart=true
autorestart=unexpected
startsecs=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
