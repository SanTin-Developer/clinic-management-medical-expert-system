[supervisord]
nodaemon=true
user=root

; The project directory is a bind mount owned by root while php-fpm runs as
; www-data; running `php artisan` via `docker exec` (root) can leave
; root-owned files under storage/, which makes Laravel fail to write logs and
; double-fault (losing CORS headers on error responses). Normalise permissions
; once on start, before php-fpm and nginx come up.
[program:fix-permissions]
command=/bin/sh -c "chmod -R a+rwX /var/www/html/storage /var/www/html/bootstrap/cache 2>/dev/null || true"
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One-shot: hit the app once so php-fpm's OPcache is warm before the first
; real request arrives. Exits after a single run.
[program:warmup]
command=sh /usr/local/bin/warmup.sh
autostart=true
autorestart=false
startsecs=0
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
