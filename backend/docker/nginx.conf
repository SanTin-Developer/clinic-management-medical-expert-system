server {
    listen 8000;
    index index.php index.html;
    root /var/www/html/public;

    # Multipart uploads (settings logo/favicon/hero image, media library,
    # staff photos, announcement poster) can carry several files in one POST.
    # nginx defaults to 1 MB and rejects larger bodies with a bare 413 that
    # carries no CORS header, which the browser reports as a confusing
    # CORS/network error instead of a real message.
    # 64m covers several files at once; Laravel still enforces the actual
    # per-file rule (DOCUMENTS_MAX_SIZE_KB = 10 MB).
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Reverb speaks the Pusher protocol under /app (WebSocket) and
    # /apps (server-to-server publishing). Proxying it through the same public
    # port lets Render expose a single HTTP port while browsers still connect
    # to wss://<api-host>/app/<key>. This location also matches /apps.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
