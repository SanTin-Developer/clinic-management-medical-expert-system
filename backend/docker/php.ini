; Development performance tuning for php-fpm.
;
; On Windows the ./backend bind mount makes file I/O extremely slow, so keep
; compiled scripts and path lookups in memory across requests:
;   * OPcache (enabled by default in the official php:fpm image) means the
;     framework files are compiled once and then served from shared memory.
;   * A larger realpath cache avoids repeated stat() calls through the mount.
;
; Code edits are still picked up (validate_timestamps=1), at most every
; revalidate_freq seconds. Set revalidate_freq=0 for instant reload.

realpath_cache_size = 4096k
realpath_cache_ttl = 600

; Upload limits. PHP's default upload_max_filesize is 2M, which silently drops
; larger files (Laravel then sees no file at all and the "upload" saves
; nothing). Chat videos are allowed up to 50 MB, so upload_max_filesize must be
; at least that large. post_max_size covers the whole POST body (e.g. the
; website settings page sending logo + favicon + hero image together).
upload_max_filesize = 52M
post_max_size = 64M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.fast_shutdown = 1
